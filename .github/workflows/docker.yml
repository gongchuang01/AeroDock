name: Docker

on:
  push:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "compose.yaml"
      - "docker/**"
      - "src/aerodock_offboard/**"
      - "tests/**"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "compose.yaml"
      - "docker/**"
      - "src/aerodock_offboard/**"
      - "tests/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build portable ROS 2 environment
        run: docker build --tag aerodock:ci .
      - name: Verify installed package
        run: docker run --rm aerodock:ci ros2 pkg executables aerodock_offboard
