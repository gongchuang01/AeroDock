name: Quality

on:
  push:
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-unit-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Compile Python sources
        run: python -m compileall -q src tools tests
      - name: Run planner unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate recorded acceptance flight
        run: python tools/validate_avoidance.py artifacts/flight/verified-avoidance.csv
      - name: Verify recorded flight visualization
        run: |
          python tools/render_flight_svg.py artifacts/flight/verified-avoidance.csv /tmp/verified-avoidance.svg
          cmp artifacts/flight/verified-avoidance.svg /tmp/verified-avoidance.svg
      - name: Validate shell scripts
        run: find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n

  ros2-build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out AeroDock
        uses: actions/checkout@v7
        with:
          path: src/AeroDock
      - name: Check out PX4 message definitions
        uses: actions/checkout@v7
        with:
          repository: PX4/px4_msgs
          ref: release/1.16
          path: src/px4_msgs
      - name: Install ROS 2 Humble
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble
      - name: Build ROS 2 packages
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --packages-up-to aerodock_offboard --event-handlers console_direct+
